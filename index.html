VOICE: santai, lucu, penyemangat LPJ untuk jeda kerja singkat

const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, String(v)); } catch (e) {} }
};
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const inRect = (p, r) => p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h;
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

const cv = document.getElementById('game');
const ctx = cv.getContext('2d');

function resize() {
  const s = Math.min(window.innerWidth / W, window.innerHeight / H);
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  cv.style.width = (W * s) + 'px';
  cv.style.height = (H * s) + 'px';
  cv.width = Math.round(W * s * dpr);
  cv.height = Math.round(H * s * dpr);
  ctx.setTransform(cv.width / W, 0, 0, cv.height / H, 0, 0);
}
window.addEventListener('resize', resize);
resize();

let actx = null;
let muted = store.get(KEY_MUTE, '0') === '1';
function ensureAudio() {
  if (!actx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (AC) { try { actx = new AC(); } catch (e) { actx = null; } }
  }
  if (actx && actx.state === 'suspended') { try { actx.resume(); } catch (e) {} }
}
function tone(f1, f2, dur, type, vol, delay) {
  if (muted || !actx) return;
  try {
    const t0 = actx.currentTime + (delay || 0);
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f1, t0);
    o.frequency.exponentialRampToValueAtTime(f2, t0 + dur);
    g.gain.setValueAtTime(vol, t0);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    o.connect(g); g.connect(actx.destination);
    o.start(t0); o.stop(t0 + dur + 0.02);
  } catch (e) {}
}
const sfx = {
  flap()    { tone(420, 720, 0.09, 'sine', 0.12); },
  score()   { tone(880, 880, 0.08, 'triangle', 0.1); tone(1320, 1320, 0.1, 'triangle', 0.1, 0.07); },
  item()    { tone(660, 990, 0.12, 'sine', 0.14); },
  lengkap() { [523, 659, 784, 1047].forEach((f, i) => tone(f, f, 0.14, 'triangle', 0.14, i * 0.09)); },
  pos()     { tone(587, 587, 0.1, 'sine', 0.12); tone(880, 880, 0.18, 'sine', 0.12, 0.1); },
  hit()     { tone(260, 70, 0.35, 'triangle', 0.2); }
};

function resetRun() {
  bird = { y: H * 0.42, vy: 0, rot: 0, wing: 0, flapT: 0 };
  pipes = []; items = []; popups = [];
  got = BERKAS.map(() => false);
  score = 0; passed = 0; tuntas = 0;

}

function spawnPipe(x) {
  const gap = gapNow();
  let lo = gap / 2 + 60, hi = GROUND_Y - gap / 2 - 50;
  const last = pipes[pipes.length - 1];
  if (last) { lo = Math.max(lo, last.c - 150); hi = Math.min(hi, last.c + 150); }
  const colors = Array.from({ length: 50 }, () => Math.floor(Math.random() * 1000));
  const p = { x, c: lo + Math.random() * (hi - lo), gap, scored: false, colors,
              revTop: Math.random() < 0.3, revBot: Math.random() < 0.3 };
  pipes.push(p);
  spawnItem(p);
}

function spawnItem(p) {
  if (Math.random() > 0.65) return;
  const onScreen = items.map(i => i.type);
  const missing = BERKAS.map((_, i) => i).filter(i => !got[i] && !onScreen.includes(i));
  if (!missing.length) return;
  const type = missing[Math.floor(Math.random() * missing.length)];
  items.push({ x: p.x + PIPE_W / 2, y: p.c + (Math.random() - 0.5) * p.gap * 0.4, type });
}

function collect(it) {
  got[it.type] = true;
  sfx.item();
  popups.push({ text: '+ ' + BERKAS[it.type], x: BIRD_X + 30, y: bird.y - 28, life: 1, big: false });
  if (got.every(Boolean)) {
    tuntas++;
    score += 5;
    got = BERKAS.map(() => false);
    popups.push({ text: 'LPJ Lengkap! +5', x: W / 2, y: H * 0.3, life: 1.8, big: true });
    sfx.lengkap();
  }
}

function circleRect(cx, cy, r, rx, ry, rw, rh) {
  const nx = clamp(cx, rx, rx + rw), ny = clamp(cy, ry, ry + rh);
  const dx = cx - nx, dy = cy - ny;
  return dx * dx + dy * dy < r * r;
}
function hitPipe(p) {
  const top = p.c - p.gap / 2, bot = p.c + p.gap / 2;
  return circleRect(BIRD_X, bird.y, BIRD_R, p.x, -50, PIPE_W, top + 50) ||
         circleRect(BIRD_X, bird.y, BIRD_R, p.x, bot, PIPE_W, GROUND_Y - bot);
}

function crash() {
  state = 'fall';
  flash = 0.12;
  sfx.hit();
  bird.vy = Math.min(bird.vy, -120);
  try { if (navigator.vibrate) navigator.vibrate(40); } catch (e) {}
}
function finish() {
  state = 'over';
  overAt = t;
  overTip = TIPS[Math.floor(Math.random() * TIPS.length)];
  const prev = best;
  if (score > best) { best = score; newBest = true; store.set(KEY_BEST, best); }
  const baru = KOSTUM.filter(k => k.min > prev && k.min <= best);
  if (baru.length) {
    const k = baru[baru.length - 1];
    unlockMsg = 'Kostum baru terbuka: ' + k.nama + '!';
    kostumSel = KOSTUM.indexOf(k);
    store.set(KEY_KOSTUM, kostumSel);
  }
}
function enterPos() {
  state = 'pos';
  posAt = t;
  posTip = TIPS[tipOrder[(passed / 10 - 1) % TIPS.length]];
  sfx.pos();
}

// ======================= KOSTUM =======================
const unlockedKostum = () => KOSTUM.map((_, i) => i).filter(i => KOSTUM[i].min <= best);
function cycleKostum() {
  const u = unlockedKostum();
  if (u.length < 2) return;
  kostumSel = u[(u.indexOf(kostumSel) + 1) % u.length];
  store.set(KEY_KOSTUM, kostumSel);
}

// ======================= INPUT =======================
const MUTE_BTN = { x: W - 48, y: 14, w: 34, h: 34 };
const PILL_KOSTUM = { x: W / 2 - 125, y: 362, w: 250, h: 36 };
const BOX_INGAT = { x: W / 2 - 150, y: 404, w: 300, h: 66 };

function flap() {
  ensureAudio();
  if (paused) { paused = false; return; }
  if (state === 'title') { state = 'ready'; return; }
  if (state === 'pos') {
    if (t - posAt > 0.8) { state = 'play'; bird.vy = FLAP_V * 0.6; bird.flapT = 0.25; }
    return;
  }
  if (state === 'ready') { state = 'play'; }
  if (state === 'play') { bird.vy = FLAP_V; bird.flapT = 0.25; sfx.flap(); return; }
  if (state === 'over' && t - overAt > 0.6) { resetRun(); state = 'ready'; }
}
cv.addEventListener('pointerdown', e => {
  e.preventDefault();
  const r = cv.getBoundingClientRect();
  const p = { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H };
  const b = MUTE_BTN;
  if (inRect(p, { x: b.x - 6, y: b.y - 6, w: b.w + 12, h: b.h + 12 })) {
    ensureAudio();
    muted = !muted;
    store.set(KEY_MUTE, muted ? '1' : '0');
    return;
  }
  if (state === 'title') {
    if (inRect(p, PILL_KOSTUM)) { cycleKostum(); return; }
  }
  flap();
});
window.addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'Enter') {
    e.preventDefault();
    if (!e.repeat) flap();
  }
});
document.addEventListener('visibilitychange', () => {
  if (document.hidden && state === 'play') paused = true;
});

// ======================= UPDATE =======================
function update(dt) {
  t += dt;
  if (paused) return;
  if (flash > 0) flash -= dt;
  for (const pp of popups) { pp.life -= dt; pp.y -= 28 * dt; }
  if (toast && state === 'play') { toast.life -= dt; if (toast.life <= 0) toast = null; }
  popups = popups.filter(pp => pp.life > 0);

  const moving = state === 'title' || state === 'ready' || state === 'play';
  const spd = state === 'play' ? speedNow() : 110;
  if (moving) {
    groundX = (groundX + spd * dt) % 28;
    islandX = (islandX + spd * 0.05 * dt) % 600;
  }
  for (const c of clouds) {
    c.x -= (moving ? spd * 0.12 : 4) * dt * c.s;
    if (c.x < -80) { c.x = W + 60 + Math.random() * 80; c.y = 60 + Math.random() * 240; }
  }
  bird.wing += dt * (bird.flapT > 0 ? 28 : 10);
  if (bird.flapT > 0) bird.flapT -= dt;

  if (state === 'title' || state === 'ready') {
    bird.y = H * 0.42 + Math.sin(t * 3) * 8;
    bird.vy = 0;
    bird.rot = 0;
    return;
  }

  if (state === 'play') {
    bird.vy = Math.min(bird.vy + GRAVITY * dt, MAX_FALL);
    bird.y += bird.vy * dt;
    if (bird.y < BIRD_R + 4) { bird.y = BIRD_R + 4; bird.vy = Math.max(bird.vy, 0); }
    bird.rot = clamp(bird.vy / 600, -0.45, 1.1);

    if (pipes.length === 0) spawnPipe(W + 40);
    const last = pipes[pipes.length - 1];
    if (last.x < W + 40 - PIPE_SPACING) spawnPipe(last.x + PIPE_SPACING);

    for (const it of items) {
      it.x -= spd * dt;
      const dx = it.x - BIRD_X, dy = it.y - bird.y;
      if (!it.taken && dx * dx + dy * dy < (BIRD_R + 15) * (BIRD_R + 15)) { it.taken = true; collect(it); }
    }
    items = items.filter(i => i.x > -30 && !i.taken);

    for (const p of pipes) {
      p.x -= spd * dt;
      if (hitPipe(p)) { crash(); return; }
    }
    for (const p of pipes) {
      if (!p.scored && p.x + PIPE_W < BIRD_X - BIRD_R) {
        p.scored = true;
        passed++;
        score++;
        sfx.score();
        if (passed % 10 === 5) { toast = { text: PENGINGAT[toastIdx % PENGINGAT.length], life: 3.5 }; toastIdx++; }
        if (passed % 10 === 0) { enterPos(); break; }
      }
    }
    pipes = pipes.filter(p => p.x > -PIPE_W - 20);

    if (state === 'play' && bird.y + BIRD_R >= GROUND_Y) { bird.y = GROUND_Y - BIRD_R; crash(); }
    return;
  }

  if (state === 'fall') {
    bird.vy = Math.min(bird.vy + GRAVITY * dt, MAX_FALL);
    bird.y += bird.vy * dt;
    bird.rot = Math.min(bird.rot + dt * 4, 1.6);
    if (bird.y + BIRD_R >= GROUND_Y) { bird.y = GROUND_Y - BIRD_R; finish(); }
  }
}

// ======================= GAMBAR: DASAR =======================
const skyGrad = ctx.createLinearGradient(0, 0, 0, GROUND_Y);
skyGrad.addColorStop(0, '#7cc4ec');
skyGrad.addColorStop(0.7, '#cdeaf6');
skyGrad.addColorStop(1, '#f3e7c9');
const seaGrad = ctx.createLinearGradient(0, 480, 0, GROUND_Y);
seaGrad.addColorStop(0, '#3aa6b9');
seaGrad.addColorStop(1, '#1f7f95');

function ellipse(x, y, rx, ry) { ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); ctx.fill(); }
function circle(x, y, r) { ellipse(x, y, r, r); }
function rrect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function text(str, x, y, size, fill, stroke, weight) {
  ctx.font = (weight || '800') + ' ' + size + 'px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  if (stroke) {
    ctx.lineWidth = Math.max(3, size / 6);
    ctx.strokeStyle = stroke;
    ctx.lineJoin = 'round';
    ctx.strokeText(str, x, y);
  }
  ctx.fillStyle = fill || '#fff';
  ctx.fillText(str, x, y);
}
function wrapText(str, x, y, maxW, lineH, size, fill, weight) {
  const wt = weight || '600';
  ctx.font = wt + ' ' + size + 'px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif';
  const lines = [];
  let line = '';
  for (const w of str.split(' ')) {
    const test = line ? line + ' ' + w : w;
    if (ctx.measureText(test).width > maxW && line) { lines.push(line); line = w; } else line = test;
  }
  lines.push(line);
  lines.forEach((l, i) => text(l, x, y + i * lineH, size, fill, null, wt));
  return lines.length;
}

function drawLogo(cx, cy, size, alpha) {
  ctx.save();
  ctx.globalAlpha = alpha;
  if (logoImg) {
    const ar = logoImg.width / logoImg.height;
    const w = ar >= 1 ? size : size * ar, h = ar >= 1 ? size / ar : size;
    ctx.drawImage(logoImg, cx - w / 2, cy - h / 2, w, h);
  } else {
    const r = size / 2;
    ctx.fillStyle = '#ffffff'; circle(cx, cy, r);
    ctx.lineWidth = r * 0.08; ctx.strokeStyle = '#1f5f8b';
    ctx.beginPath(); ctx.arc(cx, cy, r * 0.92, 0, Math.PI * 2); ctx.stroke();
    ctx.lineWidth = r * 0.03;
    ctx.beginPath(); ctx.arc(cx, cy, r * 0.74, 0, Math.PI * 2); ctx.stroke();
    text('LOGO', cx, cy - r * 0.08, r * 0.42, '#1f5f8b', null, '900');
    text('IAIN SORONG', cx, cy + r * 0.32, r * 0.16, '#1f5f8b', null, '700');
  }
  ctx.restore();
}

function drawCloud(c) {
  ctx.fillStyle = 'rgba(255,255,255,.9)';
  const s = c.s;
  ellipse(c.x, c.y, 26 * s, 16 * s);
  ellipse(c.x + 22 * s, c.y + 4 * s, 22 * s, 13 * s);
  ellipse(c.x - 22 * s, c.y + 5 * s, 20 * s, 12 * s);
}

function drawBackground(showWatermark) {
  ctx.fillStyle = skyGrad;
  ctx.fillRect(0, 0, W, GROUND_Y);
  if (showWatermark) drawLogo(W / 2, 250, 210, 0.13);
  clouds.forEach(drawCloud);

  ctx.fillStyle = 'rgba(46,107,94,.85)';             // pulau di cakrawala
  const bases = [40, 230, 420], widths = [90, 150, 70], heights = [20, 28, 16];
  bases.forEach((b, i) => {
    const x = ((b - islandX) % 600 + 600) % 600 - 100;
    ctx.beginPath();
    ctx.ellipse(x, 482, widths[i] / 2, heights[i], 0, Math.PI, 0);
    ctx.fill();
  });
  ctx.fillStyle = seaGrad;
  ctx.fillRect(0, 480, W, GROUND_Y - 480);
  ctx.strokeStyle = 'rgba(255,255,255,.35)';
  ctx.lineWidth = 2;
  for (let i = 0; i < 6; i++) {
    const y = 496 + (i % 3) * 16;
    const x = ((i * 70 - groundX * 0.6 * (1 + i % 2)) % (W + 60) + W + 60) % (W + 60) - 30;
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + 22, y); ctx.stroke();
  }
}

function drawColumn(x, edgeY, dir, len, colors, revisi) {
  const slab = 13, n = Math.ceil(len / slab) + 1;
  for (let i = 0; i < n; i++) {
    const y = dir > 0 ? edgeY + i * slab : edgeY - (i + 1) * slab;
    const v = colors[i % colors.length];
    const off = (v % 5) - 2;
    ctx.fillStyle = '#fbf8ef';
    ctx.fillRect(x + 3 + off, y + 1, PIPE_W - 6, slab - 1);
    ctx.fillStyle = FOLDERS[v % FOLDERS.length];
    ctx.fillRect(x + off, y + 3, PIPE_W, slab - 4);
    ctx.fillStyle = 'rgba(0,0,0,.18)';
    ctx.fillRect(x + off, y + slab - 2, PIPE_W, 1);
  }
  const capH = 16, capY = dir > 0 ? edgeY : edgeY - capH;   // ordner di ujung tumpukan
  ctx.fillStyle = '#2b3a55';
  rrect(x - 5, capY, PIPE_W + 10, capH, 4);
  ctx.fill();
  ctx.fillStyle = '#f4f1e6';
  if (revisi) {
    ctx.fillRect(x + PIPE_W / 2 - 22, capY + 3, 44, capH - 6);
    text('REVISI', x + PIPE_W / 2, capY + capH / 2 + 0.5, 8, '#d7263d', null, '900');
  } else {
    ctx.fillRect(x + PIPE_W / 2 - 12, capY + 4, 24, capH - 8);
  }
}

function drawPipes() {
  for (const p of pipes) {
    const top = p.c - p.gap / 2, bot = p.c + p.gap / 2;
    drawColumn(p.x, top, -1, top, p.colors, p.revTop);
    drawColumn(p.x, bot, 1, GROUND_Y - bot, p.colors.slice(7), p.revBot);
  }
}

function drawGround() {
  ctx.fillStyle = '#e8d39a';
  ctx.fillRect(0, GROUND_Y, W, GROUND_H);
  ctx.fillStyle = '#dcc286';
  for (let x = -groundX; x < W + 28; x += 28) ctx.fillRect(x, GROUND_Y + 10, 14, 4);
  ctx.fillStyle = '#7fbf5a';
  ctx.fillRect(0, GROUND_Y, W, 6);
  ctx.fillStyle = '#5e9c42';
  ctx.fillRect(0, GROUND_Y + 6, W, 2);
}

function paper() {
  ctx.fillStyle = '#ffffff';
  rrect(-10, -13, 20, 26, 3); ctx.fill();
  ctx.strokeStyle = '#c9ced6'; ctx.lineWidth = 1; ctx.stroke();
}
function drawItem(type, x, y, s) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(s, s);
  if (type === 0) {                                   // Kuitansi
    paper();
    text('Rp', 0, -3, 9, '#2e8b57', null, '900');
    ctx.fillStyle = '#c9ced6'; ctx.fillRect(-6, 5, 12, 1.5); ctx.fillRect(-6, 8.5, 8, 1.5);
  } else if (type === 1) {                            // Nota/Faktur
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.moveTo(-9, -13); ctx.lineTo(9, -13); ctx.lineTo(9, 12);
    for (let i = 1; i <= 6; i++) ctx.lineTo(9 - i * 3, i % 2 ? 9 : 12);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#c9ced6'; ctx.lineWidth = 1; ctx.stroke();
    ctx.fillStyle = '#9aa3af';
    [-8, -4, 0].forEach(yy => ctx.fillRect(-6, yy, 12, 1.6));
    ctx.fillRect(-6, 4, 7, 1.6);
  } else if (type === 2) {                            // Daftar Hadir
    ctx.fillStyle = '#a0703c'; rrect(-11, -13, 22, 27, 3); ctx.fill();
    ctx.fillStyle = '#ffffff'; ctx.fillRect(-8, -9, 16, 20);
    ctx.fillStyle = '#6b7280'; rrect(-4, -15, 8, 5, 1.5); ctx.fill();
    ctx.strokeStyle = '#3f9b5a'; ctx.lineWidth = 1.6;
    [-5, 0, 5].forEach(yy => {
      ctx.beginPath(); ctx.moveTo(-6, yy); ctx.lineTo(-4.5, yy + 1.5); ctx.lineTo(-2, yy - 1.5); ctx.stroke();
      ctx.fillStyle = '#9aa3af'; ctx.fillRect(0, yy - 0.8, 6, 1.6);
    });
  } else if (type === 3) {                            // Foto Dokumentasi
    ctx.fillStyle = '#ffffff'; rrect(-12, -10, 24, 20, 2); ctx.fill();
    ctx.strokeStyle = '#c9ced6'; ctx.lineWidth = 1; ctx.stroke();
    ctx.fillStyle = '#7cc4ec'; ctx.fillRect(-9, -7, 18, 12);
    ctx.fillStyle = '#5bb37a';
    ctx.beginPath(); ctx.moveTo(-9, 5); ctx.lineTo(-2, -3); ctx.lineTo(5, 5); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#f2c14e'; circle(5, -3, 2.5);

    ctx.fillStyle = '#fdf3d0'; rrect(-12, -8, 24, 16, 2); ctx.fill();

    ctx.fillStyle = '#d7263d'; circle(0, 2, 3);

    paper();
    text('%', 0, -2, 13, '#4f86c6', null, '900');
    ctx.fillStyle = '#c9ced6'; ctx.fillRect(-6, 8, 12, 1.5);

  if (kostum >= 2) {                                  // kacamata hitam
    ctx.strokeStyle = '#111111'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(13, -10); ctx.lineTo(6, -11); ctx.stroke();
    ctx.fillStyle = '#111111'; rrect(13.5, -15, 13, 9, 3.5); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.6)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(16, -12.5); ctx.lineTo(19, -12.5); ctx.stroke();
  }

  ctx.fillStyle = '#3b4252';                          // paruh
  ctx.beginPath(); ctx.moveTo(24, -8); ctx.lineTo(31, -6); ctx.lineTo(24, -4); ctx.closePath(); ctx.fill();

  ctx.restore();
}

// ======================= GAMBAR: LAYAR =======================
function drawMuteBtn() {
  const b = MUTE_BTN;
  ctx.fillStyle = 'rgba(15,42,68,.35)';
  rrect(b.x, b.y, b.w, b.h, 9); ctx.fill();
  const cx = b.x + 13, cy = b.y + b.h / 2;
  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  ctx.moveTo(cx - 6, cy - 4); ctx.lineTo(cx - 2, cy - 4); ctx.lineTo(cx + 4, cy - 9);
  ctx.lineTo(cx + 4, cy + 9); ctx.lineTo(cx - 2, cy + 4); ctx.lineTo(cx - 6, cy + 4);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2;
  if (muted) {
    ctx.beginPath();
    ctx.moveTo(cx + 8, cy - 5); ctx.lineTo(cx + 16, cy + 5);
    ctx.moveTo(cx + 16, cy - 5); ctx.lineTo(cx + 8, cy + 5);
    ctx.stroke();
  } else {
    ctx.beginPath(); ctx.arc(cx + 5, cy, 6, -0.9, 0.9); ctx.stroke();
    ctx.beginPath(); ctx.arc(cx + 5, cy, 10, -0.9, 0.9); ctx.stroke();
  }
}

function pesanSkor(s) {
  if (s === 0) return 'Mambruk memang lebih suka jalan kaki. Coba lagi pelan-pelan.';
  if (s < 5) return 'Lumayan, tumpukan berkas mulai terlewati.';
  if (s < 15) return 'Mantap! Tumpukan berkas bukan halangan.';
  return 'Luar biasa! LPJ-nya pasti cepat tuntas.';
}

function drawPill(r, bg, line1, line2, c1, c2) {
  ctx.fillStyle = bg;
  rrect(r.x, r.y, r.w, r.h, r.h / 2); ctx.fill();
  ctx.strokeStyle = 'rgba(27,53,80,.6)'; ctx.lineWidth = 2; ctx.stroke();
  if (line2) {
    text(line1, W / 2, r.y + 17, 13, c1, null, '700');
    text(line2, W / 2, r.y + 35, 15, c2, null, '800');
  } else {
    text(line1, W / 2, r.y + r.h / 2, 14, c1, null, '800');
  }
}

function drawTitle() {
  drawLogo(W / 2, 100, 100, 1);
  text(NAMA_GAME, W / 2, 178, 32, '#ffffff', '#1b3550');
  text(SUBJUDUL, W / 2, 208, 16, '#fff6c8', '#1b3550', '700');
  drawBird(W / 2, 282 + Math.sin(t * 3) * 6, 0, t * 10, 1.5, kostumSel);
  text('Skor terbaik: ' + best, W / 2, 338, 17, '#ffffff', '#1b3550', '700');

  const u = unlockedKostum();
  const next = KOSTUM.find(k => k.min > best);
  let label;
  if (u.length > 1) label = 'Kostum: ' + KOSTUM[kostumSel].nama + '  (ketuk ganti)';
  else label = next ? 'Kostum baru terbuka di skor ' + next.min : 'Kostum: ' + KOSTUM[kostumSel].nama;
  drawPill(PILL_KOSTUM, 'rgba(255,250,240,.9)', label, null, '#1b3550');

  const r = BOX_INGAT, siklus = 5;
  const idx = Math.floor(t / siklus) % PENGINGAT.length, fase = t % siklus;
  ctx.fillStyle = '#fff1cc';
  rrect(r.x, r.y, r.w, r.h, 16); ctx.fill();
  ctx.strokeStyle = 'rgba(27,53,80,.6)'; ctx.lineWidth = 2; ctx.stroke();
  text('Pengingat LPJ', W / 2, r.y + 15, 12, '#8a5a00', null, '800');
  ctx.save();
  ctx.globalAlpha = Math.min(1, fase / 0.4, (siklus - fase) / 0.4);
  wrapText(PENGINGAT[idx], W / 2, r.y + 35, r.w - 28, 17, 14, '#1b3550', '700');
  ctx.restore();

  if (Math.floor(t * 2) % 2 === 0) text('Ketuk untuk mulai', W / 2, 494, 22, '#fff6c8', '#1b3550');
  text('IAIN Sorong', W / 2, 610, 13, '#6b5a2e', null, '700');
}

function drawReady() {
  text('Antar LPJ ke Pos Verifikasi!', W / 2, 120, 21, '#ffffff', '#1b3550');
  text('Ambil kelengkapan berkas di jalan', W / 2, 152, 15, '#fff6c8', '#1b3550', '700');
  text('Ketuk layar untuk terbang', W / 2, 176, 15, '#fff6c8', '#1b3550', '700');
  const y = 360 + Math.sin(t * 6) * 5;
  ctx.fillStyle = 'rgba(255,255,255,.85)';
  circle(BIRD_X + 4, y, 12);
  ctx.strokeStyle = 'rgba(255,255,255,.6)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(BIRD_X + 4, y, 18 + (t * 20) % 10, 0, Math.PI * 2); ctx.stroke();
}

function drawPos() {
  ctx.fillStyle = 'rgba(15,42,68,.35)';
  ctx.fillRect(0, 0, W, H);
  const px = 30, py = 180, pw = W - 60, ph = 260;
  ctx.fillStyle = '#fffaf0';
  rrect(px, py, pw, ph, 18); ctx.fill();
  ctx.strokeStyle = '#1b3550'; ctx.lineWidth = 3; ctx.stroke();
  ctx.fillStyle = '#3f9b5a'; circle(W / 2, py + 40, 20);
  ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 4; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(W / 2 - 9, py + 40); ctx.lineTo(W / 2 - 2, py + 47); ctx.lineTo(W / 2 + 10, py + 32); ctx.stroke();
  ctx.lineCap = 'butt';
  text('Pos Verifikasi', W / 2, py + 84, 24, '#1b3550', null, '900');
  text(passed + ' rintangan terlewati', W / 2, py + 110, 14, '#5a6b80', null, '700');
  wrapText(posTip, W / 2, py + 146, pw - 40, 20, 15, '#1b3550', '700');
  if (t - posAt > 0.8 && Math.floor(t * 2) % 2 === 0) text('Ketuk untuk lanjut', W / 2, py + ph - 26, 16, '#3f9b5a', null, '800');
}

function drawOver() {
  const px = 30, py = 120, pw = W - 60, ph = 380;
  ctx.fillStyle = 'rgba(15,42,68,.25)';
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#fffaf0';
  rrect(px, py, pw, ph, 18); ctx.fill();
  ctx.strokeStyle = '#1b3550'; ctx.lineWidth = 3; ctx.stroke();

  text('Yah, jatuh!', W / 2, py + 34, 28, '#1b3550', null, '900');
  text('Skor', W / 2 - 66, py + 74, 15, '#5a6b80', null, '700');
  text(String(score), W / 2 - 66, py + 104, 38, '#1b3550', null, '900');
  text('Terbaik', W / 2 + 66, py + 74, 15, '#5a6b80', null, '700');
  text(String(best), W / 2 + 66, py + 104, 38, '#1b3550', null, '900');
  if (newBest) {
    ctx.fillStyle = '#e0614f';
    rrect(W / 2 - 52, py + 128, 104, 24, 12); ctx.fill();
    text('Rekor baru!', W / 2, py + 140, 13, '#ffffff', null, '800');
  }
  if (unlockMsg) text(unlockMsg, W / 2, py + 168, 14, '#3f9b5a', null, '800');
  text('LPJ lengkap terkumpul: ' + tuntas, W / 2, py + 196, 15, '#1b3550', null, '800');
  wrapText(pesanSkor(score), W / 2, py + 226, pw - 36, 18, 14, '#3d4b5c');
  wrapText('Tips: ' + overTip, W / 2, py + 274, pw - 36, 18, 13, '#5a6b80');

  const ready = t - overAt > 0.6;
  ctx.fillStyle = ready ? '#3f9b5a' : '#9cc5a8';
  rrect(W / 2 - 80, py + ph - 52, 160, 42, 21); ctx.fill();
  text('Main lagi', W / 2, py + ph - 31, 17, '#ffffff', null, '800');
}

function drawToast() {
  if (!toast) return;
  const a = Math.min(1, toast.life / 0.4, (3.5 - toast.life) / 0.3);
  ctx.save();
  ctx.globalAlpha = Math.max(0, a) * 0.95;
  ctx.fillStyle = '#fff1cc';
  rrect(20, 108, W - 40, 50, 14); ctx.fill();
  ctx.strokeStyle = '#1b3550'; ctx.lineWidth = 2; ctx.stroke();
  wrapText(toast.text, W / 2, 124, W - 70, 17, 13, '#1b3550', '700');
  ctx.restore();
}

function drawPopups() {
  for (const pp of popups) {
    ctx.save();
    ctx.globalAlpha = Math.min(1, pp.life * 1.5);
    if (pp.big) text(pp.text, pp.x, pp.y, 30, '#fff6c8', '#1b3550', '900');
    else text(pp.text, pp.x, pp.y, 15, '#ffffff', '#1b3550', '800');
    ctx.restore();
  }
}

function draw() {
  drawBackground(state !== 'title');
  if (state !== 'title') { drawPipes(); drawItems(); }
  drawGround();

  if (state === 'title') {
    drawTitle();
  } else {
    drawBird(BIRD_X, bird.y, bird.rot, bird.wing, 1, kostumSel);
    drawHUD();
    if (state === 'play' || state === 'pos' || state === 'fall') {
      text(String(score), W / 2, 70, 52, '#ffffff', '#1b3550', '900');
      if (tuntas > 0) text('LPJ lengkap: ' + tuntas, 70, 31, 14, '#fff6c8', '#1b3550', '800');
    }
    drawPopups();
    if (state === 'play') drawToast();
    if (state === 'ready') drawReady();
    if (state === 'pos') drawPos();
    if (state === 'over') drawOver();
  }

  if (flash > 0) {
    ctx.fillStyle = 'rgba(255,255,255,' + (flash / 0.12 * 0.6) + ')';
    ctx.fillRect(0, 0, W, H);
  }
  if (paused) {
    ctx.fillStyle = 'rgba(15,42,68,.55)';
    ctx.fillRect(0, 0, W, H);
    text('Jeda', W / 2, H / 2 - 16, 34, '#ffffff', '#1b3550');
    text('Ketuk untuk lanjut', W / 2, H / 2 + 22, 18, '#fff6c8', '#1b3550', '700');
  }
  drawMuteBtn();
}

// ======================= LOOP =======================
let lastTs = performance.now();
function frame(now) {
  let dt = (now - lastTs) / 1000;
  lastTs = now;
  if (dt > 1 / 30) dt = 1 / 30;
  if (dt < 0) dt = 0;
  update(dt);
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
}
</script>
